serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
default='Default Provisioning'
timeout=3

search --set=root --label NIRECOVERY-CD

menuentry 'Default Provisioning' {
	linux /bzImage rootwait restore=provision-safe quiet loglevel=1
	initrd /initrd
}

menuentry 'Verbose Provisioning' {
	echo 'Loading Linux ...'
	linux /bzImage rootwait restore=provision-safe verbose_mode=1
	echo 'Loading initial ramdisk ...'
	initrd /initrd
}

menuentry 'Get Image' {
	linux /bzImage rootwait restore=get-image quiet loglevel=1
	initrd /initrd
}

menuentry 'Set Image' {
	linux /bzImage rootwait restore=set-image quiet loglevel=1
	initrd /initrd
}

menuentry 'Provision over network' {
    linux /bzImage rootwait \
        restore=provision-network \
        NETWORK_BOOTSTRAP_ENABLED=1 \
        PROVISIONING_BUNDLE_URL=http://10.152.9.78:8000/ni_provisioning.tar.gz \
        PROVISION_ANSWERS_URL=http://10.152.9.78:8000/ni_provisioning.answers \
        PAYLOAD_BASE=/netprov/payload
    initrd /initrd
    boot
}

menu background splash.jpg
